name: Backend CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentdesk
          POSTGRES_PASSWORD: agentdesk
          POSTGRES_DB: agentdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Mypy Type Check
        run: uv run mypy agents tools skills backend eval scripts

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://agentdesk:agentdesk@127.0.0.1:5432/agentdesk_test
        run: uv run alembic upgrade head

      - name: Check OpenAPI Contract Drift
        run: |
          uv run python scripts/export_openapi.py --check
          uv run pytest tests/unit/test_openapi_contract.py -q

      - name: Check Tool Schemas Drift
        run: uv run python scripts/export_tool_schemas.py --check

      - name: Validate Agent Contracts & Golden Dataset
        run: |
          uv run python scripts/validate_agent_contracts.py
          uv run python scripts/validate_golden_dataset.py

      - name: Run Unit and Integration Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://agentdesk:agentdesk@127.0.0.1:5432/agentdesk_test
          REDIS_URL: redis://127.0.0.1:6379/15
        run: uv run pytest tests/unit tests/integration -v
