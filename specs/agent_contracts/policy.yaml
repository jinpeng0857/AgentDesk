version: "1.0.0"
agent_id: policy
input_models:
  - PendingOperation
  - ActorContext
  - ResourceContext
output_models:
  - RiskDecision
  - PolicyExplanation
allowed_tools: []
state_writes:
  - risk_decision
invariants:
  - Deterministic rules produce every final Policy field.
  - A model may render explanation only after the decision exists.
  - High risk always requires human approval.
  - Self-service access requests for administrator, privileged, root, or equivalent resources require human approval.
  - Unknown or unauthorized operations are denied.
  - Password resets are denied when the target account is missing, inactive, or cannot be verified from PostgreSQL.
failure_codes:
  - POLICY_DENIED
  - APPROVAL_REQUIRED
  - POLICY_CONTEXT_INVALID
