name: agentdesk

services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: agentdesk
      POSTGRES_USER: agentdesk
      POSTGRES_PASSWORD: agentdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdesk -d agentdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://agentdesk:agentdesk@postgres:5432/agentdesk}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CHROMA_PATH=${CHROMA_PATH:-/data/chroma}
      - JWT_SECRET=agentdesk_development_secret_key_2026_at_least_32_bytes_long
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-deepseek-chat}
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    command: arq backend.jobs.worker.WorkerSettings
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://agentdesk:agentdesk@postgres:5432/agentdesk}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CHROMA_PATH=${CHROMA_PATH:-/data/chroma}
      - JWT_SECRET=agentdesk_development_secret_key_2026_at_least_32_bytes_long
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-deepseek-chat}
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
