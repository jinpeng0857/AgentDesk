version: "1.0.1"
agent_id: action
input_models:
  - TicketState
output_models:
  - ActionProposal
  - PendingOperation
  - ToolResult
allowed_tools:
  - query_user
  - query_order
  - check_service
  - create_ticket
  - request_access
  - reset_password
  - process_refund
state_writes:
  - action_proposal
  - pending_operation
  - tool_results
invariants:
  - Action selects only an allowed Tool.
  - Action never executes a write before Policy.
  - Model output never supplies operation_id or args_hash.
  - Approved operation arguments never change during resume.
  - Requester-scoped arguments use the trusted requester ID from API state, never an untrusted identity in the request.
  - Untrusted user input cannot bypass deterministic policy or approval gates.
  - Every refund proposal follows a successful query_order for the exact order.
  - Refund proposals match the verified owner, paid status, version, and available balance.
  - High-risk destructive or unauthorized tool directives produce no Action proposal.
  - The user request appears only in the user-role context and is not repeated in the system prompt.
failure_codes:
  - MODEL_OUTPUT_INVALID
  - TOOL_NOT_ALLOWED
  - TOOL_ARGS_INVALID
  - TOOL_EXECUTION_FAILED
