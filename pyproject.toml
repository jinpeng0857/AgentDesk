[project]
name = "agentdesk"
version = "0.1.0"
description = "AgentDesk - reliable multi-agent workflow automation runtime"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "arq>=0.26,<1",
    "asyncpg>=0.30,<1",
    "chromadb>=1,<2",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "openai>=1.70,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pwdlib[argon2]>=0.2,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "PyJWT[crypto]>=2.10,<3",
    "redis>=5.2,<8",
    "SQLAlchemy[asyncio]>=2,<3",
    "structlog>=24.4,<27",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
observability = [
    "langfuse>=3,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "PyYAML>=6,<7",
    "ruff>=0.11,<1",
    "types-PyYAML>=6,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 单一分发包：所有 Python 包位于 src/，对外 import 名保持 agents/tools/skills/backend/eval。
[tool.setuptools.packages.find]
where = ["src"]
include = ["agents*", "tools*", "skills*", "backend*", "eval*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# numpy's bundled stubs use PEP 695 `type` statements that require Python 3.12.
# numpy is reached only through third-party packages we consume as opaque
# dependencies (chromadb, and the openai SDK's optional voice-helper proxy), so
# skip following those packages rather than raising the project's own target
# version. Our code never depends on their declared types.
[[tool.mypy.overrides]]
module = [
    "chromadb",
    "chromadb.*",
    "openai._extras.numpy_proxy",
    "langgraph",
    "langgraph.*",
    "langchain",
    "langchain.*",
    "langchain_core",
    "langchain_core.*",
]
follow_imports = "skip"
